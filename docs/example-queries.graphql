# Paste these into Apollo Sandbox at http://localhost:4000/graphql
# There are no demo accounts. Register first (or log in with an account you created in the app),
# then add the returned token as a header for protected operations:
#   Authorization: Bearer <token>

mutation RegisterStudent {
  register(input: { name: "Your Name", email: "you@univ.edu", password: "choose-a-password", role: STUDENT }) {
    token
    user { id name role }
  }
}

# `role` is the portal you are logging in to; the login fails if the account has a different role.
mutation Login {
  login(email: "you@univ.edu", password: "choose-a-password", role: STUDENT) {
    token
    user { id name role }
  }
}

# Search across the new fields: cloud or devops faculty with Java + Spring Boot, most open slots first
query CloudDevopsFaculty {
  searchFaculty(input: { areas: ["cloud", "devops"], skills: ["java", "spring boot"], matchAnySkill: true, sortBy: OPEN_SLOTS }) {
    totalCount
    items { name title department { code } lab { name openSlots } }
  }
}

# Filter values that exist in the data (for building dropdowns)
query FacultyFilterOptions {
  filterOptions(role: FACULTY) { areas { value count } skills { value count } titles }
}

# 1. The headline query — one MongoDB aggregation ($lookup publications + labs, $facet for paging)
query ActiveNlpFacultyWithOpenSlots {
  searchFaculty(input: { area: "nlp", publishedWithinYears: 2, hasOpenSlots: true }) {
    totalCount
    items {
      name
      title
      department { code }
      lab { name openSlots }
      recentPublicationCount
      publications(sinceYear: 2024) { title year venue }
    }
  }
}

# 2. Faculty-only (@auth(requires: FACULTY)) — try it with a student token to see FORBIDDEN
query UnattachedPythonGenomicsStudents {
  searchStudents(input: { skills: ["python", "genomics"], unattached: true }) {
    totalCount
    items { name email program skills { name level } interests }
  }
}

# 3. Three different shapes of the same User type — the over/under-fetching point.
#    Search card:
query Card { searchFaculty(input: { limit: 3 }) { items { id name lab { openSlots } } } }

#    Full profile (replace the id):
query FullProfile($id: ID!) {
  user(id: $id) {
    name bio interests
    skills { name level }
    publications { title year authors { name } }
    connections { name }
    projects { title status members { name } }
  }
}

# 4. Lab dashboard — deepest nesting in the app, one request
query Dashboard($labId: ID!) {
  lab(id: $labId) {
    name openSlots totalActiveFunding
    members { name projects { title } }
    grants { agency amount isActive }
    pendingRequests { requester { name skills { name } } project { title } message }
  }
}

# 5. N+1 demo: run this, then run it again with header  x-dataloader: off
#    and compare `extensions.dbQueries` in the response (≈8 vs ≈89).
query NPlusOneDemo {
  searchFaculty(input: { limit: 20 }) {
    items {
      name
      department { name }
      lab { name members { name department { code } } }
      publications { title authors { name } }
      projects { title }
    }
  }
}

# 6. Explainable recommendations with custom weights (use a student token)
query Matches {
  recommendedMentors(limit: 5, weights: { skill: 0.3, interest: 0.4, recency: 0.2, availability: 0.1 }) {
    score
    reasons
    breakdown { skill interest recency availability }
    faculty { name lab { name } }
  }
}

# 7. Real-time — open in one Sandbox tab (with a faculty token), then send a join request from another
subscription Live {
  notificationAdded { type message actor { name } project { title } createdAt }
}
